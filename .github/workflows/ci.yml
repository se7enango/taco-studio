name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # next build/start run on Node (the next CLI's shebang), so pin it to the same major as Vercel.
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json # reads engines.node
      # No inputs: setup-bun reads "packageManager": "bun@1.4.2" from package.json.
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
